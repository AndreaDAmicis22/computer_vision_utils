[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utils"
version = "0.1.0"
description = "Collection of utility functions for image processing, computer vision and deep learning models."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
    { name = "Andrea D'Amicis", email = "andrea.damicis2001@gmail.com" }
]
keywords = ["computer-vision", "image-processing", "opencv", "torch", "augmentation", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

# Main dependencies
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "matplotlib>=3.5",
    "pandas>=2.3",
    "scikit-learn>=1.8",
    "scipy>=1.16",
    "seaborn>=0.13",
    "torch>=2.9",
    "torchvision>=0.24",
    "timm>=1.0",
    "onnxruntime-gpu>=1.23",
    "ultralytics>=8.3",
    "Pillow>=12",
    "PyYAML>=6.0",
    "requests>=2.32"
]

# Optional dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=6.0",
    "flake8>=6.0",
    "mypy>=1.5"
]

# Entry points
# [project.scripts]
# utils-cli = "utils.cli:main"  # esempio se aggiungi un file cli.py con funzione main()

# Command to install
# pip install --config-settings editable_mode=compat -e .
